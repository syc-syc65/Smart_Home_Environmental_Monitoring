<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物联网后台管理系统</title>
  <!-- Element Plus CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.8.4/dist/index.css">
  <!-- ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <!-- Vue 3 -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.js"></script>
  <!-- Element Plus JS -->
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.8.4/dist/index.full.js"></script>
  <!-- Vue Router -->
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4.4.5/dist/vue-router.global.js"></script>
</head>
<body>
  <div id="app"></div>

  <script>
    const { createApp, ref, computed, onMounted, reactive, watch } = Vue
    const { createRouter, createWebHashHistory } = VueRouter
    const { ElMessage, ElMessageBox } = ElementPlus

    // 登录页面组件
    const Login = {
      template: `
        <div class="login-container">
          <div class="login-box">
            <div class="login-header">
              <div class="login-logo">
                <el-icon class="logo-icon"><Cloud /></el-icon>
                <h2>物联网管理系统</h2>
              </div>
              <p>请登录以访问系统</p>
            </div>
            <el-form :model="loginForm" :rules="rules" ref="loginFormRef" class="login-form">
              <el-form-item prop="username">
                <el-input
                  v-model="loginForm.username"
                  placeholder="用户名"
                  prefix-icon="User"
                  class="login-input"
                />
              </el-form-item>
              <el-form-item prop="password">
                <el-input
                  v-model="loginForm.password"
                  type="password"
                  placeholder="密码"
                  prefix-icon="Lock"
                  show-password
                  class="login-input"
                />
              </el-form-item>
              <el-form-item class="remember-item">
                <el-checkbox v-model="rememberMe">记住我</el-checkbox>
                <el-link type="primary" :underline="false" class="forgot-link">忘记密码?</el-link>
              </el-form-item>
              <el-form-item>
                <el-button type="primary" class="login-btn" @click="login" :loading="loading">
                  登录
                </el-button>
              </el-form-item>
              <div class="login-tip">
                <h4>测试账号</h4>
                <p>用户名: <span class="tip-highlight">admin</span></p>
                <p>密码: <span class="tip-highlight">admin123</span></p>
              </div>
            </el-form>
          </div>
        </div>
      `,
      setup() {
        const router = VueRouter.useRouter()
        const loginFormRef = ref(null)
        const loading = ref(false)
        const rememberMe = ref(false)

        const loginForm = reactive({
          username: '',
          password: ''
        })

        // 检查本地存储中的记住我状态
        const initLoginForm = () => {
          const savedUsername = localStorage.getItem('savedUsername')
          const savedRememberMe = localStorage.getItem('rememberMe')
          if (savedRememberMe === 'true' && savedUsername) {
            loginForm.username = savedUsername
            rememberMe.value = true
          }
        }

        // 初始化登录表单
        initLoginForm()

        const rules = {
          username: [
            { required: true, message: '请输入用户名', trigger: 'blur' }
          ],
          password: [
            { required: true, message: '请输入密码', trigger: 'blur' }
          ]
        }

        const login = async () => {
          if (!loginFormRef.value) return
          
          await loginFormRef.value.validate(async (valid) => {
            if (valid) {
              loading.value = true
              try {
                // 模拟登录验证
                if (loginForm.username === 'admin' && loginForm.password === 'admin123') {
                  localStorage.setItem('isLoggedIn', 'true')
                  localStorage.setItem('username', loginForm.username)
                  
                  // 保存记住我状态
                  if (rememberMe.value) {
                    localStorage.setItem('savedUsername', loginForm.username)
                    localStorage.setItem('rememberMe', 'true')
                  } else {
                    localStorage.removeItem('savedUsername')
                    localStorage.removeItem('rememberMe')
                  }
                  
                  ElMessage.success('登录成功')
                  router.push('/dashboard')
                } else {
                  ElMessage.error('用户名或密码错误')
                }
              } catch (error) {
                ElMessage.error('登录失败，请重试')
              } finally {
                loading.value = false
              }
            }
          })
        }

        return {
          loginFormRef,
          loading,
          rememberMe,
          loginForm,
          rules,
          login
        }
      }
    }

    // 数据驾驶舱组件
    const Dashboard = {
      template: `
        <div class="dashboard">
          <!-- 页面标题 -->
          <div class="page-header">
            <h1>数据驾驶舱</h1>
            <div class="header-actions">
              <el-date-picker
                v-model="dateRange"
                type="daterange"
                range-separator="至"
                start-placeholder="开始日期"
                end-placeholder="结束日期"
                value-format="YYYY-MM-DD"
                class="date-picker"
              />
              <el-select v-model="deviceFilter" placeholder="选择设备" class="filter-select">
                <el-option label="全部设备" value="" />
                <el-option label="温度传感器" value="temperature" />
                <el-option label="湿度传感器" value="humidity" />
                <el-option label="烟雾传感器" value="smoke" />
              </el-select>
              <el-select v-model="refreshInterval" placeholder="刷新间隔" class="filter-select">
                <el-option label="手动" value="0" />
                <el-option label="10秒" value="10000" />
                <el-option label="30秒" value="30000" />
                <el-option label="1分钟" value="60000" />
              </el-select>
              <el-button type="primary" @click="refreshData" class="refresh-btn">
                <el-icon><Refresh /></el-icon> 刷新数据
              </el-button>
              <el-dropdown @command="handleExport">
                <el-button type="success">
                  <el-icon><Download /></el-icon> 导出数据
                  <el-icon class="el-icon--right"><ArrowDown /></el-icon>
                </el-button>
                <template #dropdown>
                  <el-dropdown-menu>
                    <el-dropdown-item command="excel">导出为 Excel</el-dropdown-item>
                    <el-dropdown-item command="csv">导出为 CSV</el-dropdown-item>
                    <el-dropdown-item command="pdf">导出为 PDF</el-dropdown-item>
                  </el-dropdown-menu>
                </template>
              </el-dropdown>
            </div>
          </div>

          <!-- 核心KPI卡片 -->
          <div class="kpi-grid">
            <el-card class="kpi-card">
              <div class="kpi-header">
                <span class="kpi-title">实时温度</span>
                <el-icon class="kpi-icon"><Sunny /></el-icon>
              </div>
              <div class="kpi-value">{{ realTimeData.temperature }}°C</div>
              <div class="kpi-trend" :class="realTimeData.tempTrend">
                <el-icon v-if="realTimeData.tempTrend === 'up'"><ArrowUp /></el-icon>
                <el-icon v-else-if="realTimeData.tempTrend === 'down'"><ArrowDown /></el-icon>
                <el-icon v-else><Minus /></el-icon>
                {{ realTimeData.tempChange }}%
              </div>
              <div class="kpi-chart">
                <canvas ref="tempChart"></canvas>
              </div>
            </el-card>

            <el-card class="kpi-card">
              <div class="kpi-header">
                <span class="kpi-title">实时湿度</span>
                <el-icon class="kpi-icon"><Water /></el-icon>
              </div>
              <div class="kpi-value">{{ realTimeData.humidity }}%</div>
              <div class="kpi-trend" :class="realTimeData.humiTrend">
                <el-icon v-if="realTimeData.humiTrend === 'up'"><ArrowUp /></el-icon>
                <el-icon v-else-if="realTimeData.humiTrend === 'down'"><ArrowDown /></el-icon>
                <el-icon v-else><Minus /></el-icon>
                {{ realTimeData.humiChange }}%
              </div>
              <div class="kpi-chart">
                <canvas ref="humiChart"></canvas>
              </div>
            </el-card>

            <el-card class="kpi-card">
              <div class="kpi-header">
                <span class="kpi-title">设备在线率</span>
                <el-icon class="kpi-icon"><Connection /></el-icon>
              </div>
              <div class="kpi-value">{{ deviceStats.onlineRate }}%</div>
              <div class="kpi-desc">
                {{ deviceStats.onlineCount }}/{{ deviceStats.totalCount }} 台设备在线
              </div>
              <div class="kpi-chart">
                <canvas ref="onlineChart"></canvas>
              </div>
            </el-card>

            <el-card class="kpi-card">
              <div class="kpi-header">
                <span class="kpi-title">报警次数</span>
                <el-icon class="kpi-icon"><Warning /></el-icon>
              </div>
              <div class="kpi-value">{{ alarmStats.count }}</div>
              <div class="kpi-desc">
                近24小时内
              </div>
              <div class="kpi-chart">
                <canvas ref="alarmChart"></canvas>
              </div>
            </el-card>
          </div>

          <!-- 图表区域 -->
          <div class="chart-grid">
            <!-- 传感器数据趋势 -->
            <el-card class="chart-card">
              <template #header>
                <div class="card-header">
                  <span>传感器数据趋势</span>
                  <el-select v-model="chartInterval" size="small" class="chart-interval">
                    <el-option label="1小时" value="1h" />
                    <el-option label="24小时" value="24h" />
                    <el-option label="7天" value="7d" />
                  </el-select>
                </div>
              </template>
              <div class="chart-container">
                <canvas ref="sensorChart"></canvas>
              </div>
            </el-card>

            <!-- 设备状态分布 -->
            <el-card class="chart-card">
              <template #header>
                <div class="card-header">
                  <span>设备状态分布</span>
                </div>
              </template>
              <div class="chart-container">
                <canvas ref="deviceStatusChart"></canvas>
              </div>
            </el-card>

            <!-- 历史数据统计 -->
            <el-card class="chart-card">
              <template #header>
                <div class="card-header">
                  <span>历史数据统计</span>
                </div>
              </template>
              <div class="chart-container">
                <canvas ref="historyChart"></canvas>
              </div>
            </el-card>

            <!-- 设备性能雷达图 -->
            <el-card class="chart-card">
              <template #header>
                <div class="card-header">
                  <span>设备性能雷达图</span>
                </div>
              </template>
              <div class="chart-container">
                <canvas ref="radarChart"></canvas>
              </div>
            </el-card>

            <!-- 系统健康状态 -->
            <el-card class="chart-card">
              <template #header>
                <div class="card-header">
                  <span>系统健康状态</span>
                </div>
              </template>
              <div class="chart-container">
                <canvas ref="gaugeChart"></canvas>
              </div>
            </el-card>

            <!-- 报警事件时间线 -->
            <el-card class="chart-card">
              <template #header>
                <div class="card-header">
                  <span>报警事件时间线</span>
                </div>
              </template>
              <div class="alarm-timeline">
                <el-timeline>
                  <el-timeline-item
                    v-for="(alarm, index) in alarmEvents"
                    :key="index"
                    :timestamp="alarm.time"
                    :type="alarm.type"
                  >
                    <div class="alarm-item">
                      <h4>{{ alarm.title }}</h4>
                      <p>{{ alarm.description }}</p>
                      <span class="alarm-level" :class="alarm.level">{{ alarm.levelText }}</span>
                    </div>
                  </el-timeline-item>
                </el-timeline>
              </div>
            </el-card>
          </div>
        </div>
      `,
      setup() {
        // 响应式数据
        const dateRange = ref(['2024-01-01', '2024-01-31'])
        const chartInterval = ref('24h')
        const deviceFilter = ref('')
        const refreshInterval = ref('0')
        let refreshTimer = null

        // 实时数据
        const realTimeData = reactive({
          temperature: 25.6,
          humidity: 45.2,
          tempTrend: 'up',
          tempChange: 2.3,
          humiTrend: 'down',
          humiChange: 1.5
        })

        // 设备统计
        const deviceStats = reactive({
          totalCount: 10,
          onlineCount: 8,
          onlineRate: 80
        })

        // 报警统计
        const alarmStats = reactive({
          count: 5
        })

        // 报警事件
        const alarmEvents = [
          {
            time: '2024-01-31 14:30',
            title: '温度异常',
            description: '设备1温度超过阈值',
            type: 'warning',
            level: 'high',
            levelText: '高'
          },
          {
            time: '2024-01-31 12:15',
            title: '湿度异常',
            description: '设备2湿度低于阈值',
            type: 'danger',
            level: 'medium',
            levelText: '中'
          },
          {
            time: '2024-01-31 10:45',
            title: '设备离线',
            description: '设备3网络连接中断',
            type: 'info',
            level: 'low',
            levelText: '低'
          }
        ]

        // 图表引用
        const tempChart = ref(null)
        const humiChart = ref(null)
        const onlineChart = ref(null)
        const alarmChart = ref(null)
        const sensorChart = ref(null)
        const deviceStatusChart = ref(null)
        const historyChart = ref(null)
        const radarChart = ref(null)
        const gaugeChart = ref(null)

        // 图表实例
        let tempChartInstance = null
        let humiChartInstance = null
        let onlineChartInstance = null
        let alarmChartInstance = null
        let sensorChartInstance = null
        let deviceStatusChartInstance = null
        let historyChartInstance = null
        let radarChartInstance = null
        let gaugeChartInstance = null

        // 初始化图表
        const initCharts = () => {
          // 温度小图表
          tempChartInstance = echarts.init(tempChart.value)
          tempChartInstance.setOption({
            grid: { top: 5, right: 5, bottom: 5, left: 5 },
            xAxis: { show: false },
            yAxis: { show: false },
            series: [{
              type: 'line',
              data: [22, 23, 24, 23, 25, 26, 25.6],
              smooth: true,
              lineStyle: { color: '#f97316', width: 2 },
              areaStyle: { color: 'rgba(249, 115, 22, 0.1)' }
            }]
          })

          // 湿度小图表
          humiChartInstance = echarts.init(humiChart.value)
          humiChartInstance.setOption({
            grid: { top: 5, right: 5, bottom: 5, left: 5 },
            xAxis: { show: false },
            yAxis: { show: false },
            series: [{
              type: 'line',
              data: [48, 47, 46, 45, 46, 45.5, 45.2],
              smooth: true,
              lineStyle: { color: '#38bdf8', width: 2 },
              areaStyle: { color: 'rgba(56, 189, 248, 0.1)' }
            }]
          })

          // 在线率小图表
          onlineChartInstance = echarts.init(onlineChart.value)
          onlineChartInstance.setOption({
            grid: { top: 5, right: 5, bottom: 5, left: 5 },
            xAxis: { show: false },
            yAxis: { show: false },
            series: [{
              type: 'line',
              data: [75, 78, 80, 79, 80, 80],
              smooth: true,
              lineStyle: { color: '#22c55e', width: 2 },
              areaStyle: { color: 'rgba(34, 197, 94, 0.1)' }
            }]
          })

          // 报警小图表
          alarmChartInstance = echarts.init(alarmChart.value)
          alarmChartInstance.setOption({
            grid: { top: 5, right: 5, bottom: 5, left: 5 },
            xAxis: { show: false },
            yAxis: { show: false },
            series: [{
              type: 'line',
              data: [2, 3, 1, 2, 5],
              smooth: true,
              lineStyle: { color: '#ef4444', width: 2 },
              areaStyle: { color: 'rgba(239, 68, 68, 0.1)' }
            }]
          })

          // 传感器数据趋势
          sensorChartInstance = echarts.init(sensorChart.value)
          sensorChartInstance.setOption({
            tooltip: {
              trigger: 'axis'
            },
            legend: {
              data: ['温度', '湿度'],
              textStyle: { color: '#94a3b8' }
            },
            grid: {
              left: '3%',
              right: '4%',
              bottom: '3%',
              containLabel: true
            },
            xAxis: {
              type: 'category',
              boundaryGap: false,
              data: ['00:00', '03:00', '06:00', '09:00', '12:00', '15:00', '18:00', '21:00'],
              axisLine: { lineStyle: { color: '#334155' } },
              axisLabel: { color: '#94a3b8' }
            },
            yAxis: [
              {
                type: 'value',
                name: '温度 (°C)',
                axisLine: { lineStyle: { color: '#f97316' } },
                axisLabel: { color: '#94a3b8' },
                splitLine: { lineStyle: { color: '#334155' } }
              },
              {
                type: 'value',
                name: '湿度 (%)',
                axisLine: { lineStyle: { color: '#38bdf8' } },
                axisLabel: { color: '#94a3b8' },
                splitLine: { show: false }
              }
            ],
            series: [
              {
                name: '温度',
                type: 'line',
                data: [22, 21, 20, 23, 25, 26, 25, 24],
                lineStyle: { color: '#f97316' },
                areaStyle: { color: 'rgba(249, 115, 22, 0.1)' }
              },
              {
                name: '湿度',
                type: 'line',
                yAxisIndex: 1,
                data: [45, 46, 47, 45, 43, 42, 44, 45],
                lineStyle: { color: '#38bdf8' },
                areaStyle: { color: 'rgba(56, 189, 248, 0.1)' }
              }
            ]
          })

          // 设备状态分布
          deviceStatusChartInstance = echarts.init(deviceStatusChart.value)
          deviceStatusChartInstance.setOption({
            tooltip: {
              trigger: 'item'
            },
            legend: {
              orient: 'vertical',
              left: 'left',
              textStyle: { color: '#94a3b8' }
            },
            series: [
              {
                type: 'pie',
                radius: '60%',
                center: ['50%', '50%'],
                data: [
                  { value: 8, name: '在线' },
                  { value: 2, name: '离线' }
                ],
                itemStyle: {
                  borderRadius: 8,
                  borderColor: '#1e293b',
                  borderWidth: 2
                },
                label: {
                  color: '#f8fafc'
                },
                colors: ['#22c55e', '#ef4444']
              }
            ]
          })

          // 历史数据统计
          historyChartInstance = echarts.init(historyChart.value)
          historyChartInstance.setOption({
            tooltip: {
              trigger: 'axis'
            },
            grid: {
              left: '3%',
              right: '4%',
              bottom: '3%',
              containLabel: true
            },
            xAxis: {
              type: 'category',
              data: ['1月25日', '1月26日', '1月27日', '1月28日', '1月29日', '1月30日', '1月31日'],
              axisLine: { lineStyle: { color: '#334155' } },
              axisLabel: { color: '#94a3b8' }
            },
            yAxis: {
              type: 'value',
              axisLine: { lineStyle: { color: '#334155' } },
              axisLabel: { color: '#94a3b8' },
              splitLine: { lineStyle: { color: '#334155' } }
            },
            series: [
              {
                type: 'bar',
                data: [120, 132, 101, 134, 90, 230, 210],
                itemStyle: {
                  color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: '#38bdf8' },
                    { offset: 1, color: '#0ea5e9' }
                  ])
                }
              }
            ]
          })

          // 设备性能雷达图
          radarChartInstance = echarts.init(radarChart.value)
          radarChartInstance.setOption({
            tooltip: {},
            radar: {
              indicator: [
                { name: '响应速度', max: 100 },
                { name: '稳定性', max: 100 },
                { name: '能耗', max: 100 },
                { name: '准确率', max: 100 },
                { name: '连接质量', max: 100 },
                { name: '数据完整性', max: 100 }
              ],
              splitArea: {
                areaStyle: {
                  color: ['rgba(56, 189, 248, 0.05)', 'rgba(56, 189, 248, 0.1)']
                }
              },
              axisLine: {
                lineStyle: {
                  color: 'rgba(56, 189, 248, 0.5)'
                }
              },
              splitLine: {
                lineStyle: {
                  color: 'rgba(56, 189, 248, 0.3)'
                }
              }
            },
            series: [
              {
                type: 'radar',
                data: [
                  {
                    value: [85, 90, 75, 95, 88, 92],
                    name: '设备性能',
                    areaStyle: {
                      color: 'rgba(56, 189, 248, 0.2)'
                    },
                    lineStyle: {
                      color: '#38bdf8'
                    },
                    itemStyle: {
                      color: '#38bdf8'
                    }
                  }
                ]
              }
            ]
          })

          // 系统健康状态仪表盘
          gaugeChartInstance = echarts.init(gaugeChart.value)
          gaugeChartInstance.setOption({
            tooltip: {
              formatter: '{a} <br/>{b} : {c}%'
            },
            series: [
              {
                name: '系统健康',
                type: 'gauge',
                detail: {
                  formatter: '{value}%',
                  textStyle: {
                    color: '#f8fafc'
                  }
                },
                data: [
                  {
                    value: 85,
                    name: '健康状态'
                  }
                ],
                axisLine: {
                  lineStyle: {
                    width: 30,
                    color: [
                      [0.3, '#ef4444'],
                      [0.7, '#f59e0b'],
                      [1, '#22c55e']
                    ]
                  }
                },
                pointer: {
                  itemStyle: {
                    color: '#38bdf8'
                  }
                },
                axisTick: {
                  distance: -30,
                  length: 8,
                  lineStyle: {
                    color: '#f8fafc',
                    width: 2
                  }
                },
                splitLine: {
                  distance: -30,
                  length: 30,
                  lineStyle: {
                    color: '#f8fafc',
                    width: 2
                  }
                },
                axisLabel: {
                  color: '#94a3b8',
                  distance: -40,
                  fontSize: 12
                },
                title: {
                  color: '#94a3b8',
                  fontSize: 14
                }
              }
            ]
          })
        }

        // 刷新数据
        const refreshData = () => {
          // 模拟数据刷新
          realTimeData.temperature = (20 + Math.random() * 10).toFixed(1)
          realTimeData.humidity = (30 + Math.random() * 40).toFixed(1)
          realTimeData.tempTrend = Math.random() > 0.5 ? 'up' : 'down'
          realTimeData.humiTrend = Math.random() > 0.5 ? 'up' : 'down'
          realTimeData.tempChange = (Math.random() * 5).toFixed(1)
          realTimeData.humiChange = (Math.random() * 5).toFixed(1)
          
          // 重新渲染图表
          initCharts()
        }

        // 导出数据
